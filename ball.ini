def find_ball_position(M, swaps):
    ball_position = 1  # 공은 처음 1번 컵에 들어있음

    for swap in swaps:
        X, Y = swap
        # X와 Y의 위치가 바뀌면, 공이 그 컵에 있으면 바꿔줍니다.
        if ball_position == X:
            ball_position = Y
        elif ball_position == Y:
            ball_position = X

    return ball_position

# 입력 처리
M = int(input())  # 컵을 바꾼 횟수
swaps = [tuple(map(int, input().split())) for _ in range(M)]  # M번의 컵 번호 교환

# 결과 출력
print(find_ball_position(M, swaps))

